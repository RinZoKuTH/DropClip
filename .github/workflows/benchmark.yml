name: Nightly Performance Benchmark & Soak Simulation

on:
  schedule:
    - cron: '0 19 * * *' # Every night at 02:00 AM ICT (19:00 UTC)
  workflow_dispatch:

jobs:
  nightly-benchmark:
    name: Run Benchmark Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install Melos
        run: dart pub global activate melos ^6.0.0

      - name: Bootstrap Workspace
        run: melos bootstrap

      # Path-vector smoke check (not a real fuzzer yet); fails on any unblocked vector.
      - name: Run Protocol Fuzzer
        working-directory: tools/protocol_fuzzer
        run: dart run bin/fuzzer.dart

      # SAS micro-benchmark only; fails when the per-op target is exceeded.
      - name: Run Benchmark
        working-directory: tools/bench
        run: dart run bin/bench.dart

